[package]
name = "shellvibe"
version = "0.3.6"
edition = "2024"
rust-version = "1.98"
description = "Observable MCP shell access with process lifecycle controls and modern Tasks support"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Qrzysztof/shellvibe"
homepage = "https://github.com/Qrzysztof/shellvibe"
documentation = "https://docs.rs/shellvibe"
keywords = ["mcp", "shell", "agent", "terminal", "bash"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "install.sh"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dashmap = "6.2.1"
portable-pty = "0.9.0"
rmcp = { version = "3.1.4", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.26.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }

[dev-dependencies]
rmcp = { version = "3.1.4", default-features = false, features = ["client", "server", "transport-io"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
