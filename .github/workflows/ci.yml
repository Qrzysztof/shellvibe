name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint / Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (latest stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all targets, warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV (1.98.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.98.0 (declared MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2.9.2

      - name: Check all targets compile on the MSRV
        run: cargo check --all-targets --all-features --locked

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (latest stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2.9.2

      - name: Run all tests (unit + integration, spawns the real binary)
        run: cargo test --all-targets --all-features --locked

      - name: Verify release build
        run: cargo build --release --locked
